name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Typecheck, Unit & Postgres Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kanban
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kanban -d kanban"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Run unit tests (mocked DB)
        working-directory: server
        run: npm test

      - name: Run PostgreSQL & SSE integration tests
        working-directory: server
        env:
          DATABASE_URL: postgres://kanban:testpassword@localhost:5432/kanban
          PORT: "4100"
          FAILURE_RATE: "0"
        run: npm run test:integration

  client:
    name: Client (Typecheck, Build & Store Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Build production bundle
        working-directory: client
        run: npm run build

      - name: Run store & positioning tests
        working-directory: client
        run: npm test

  docker-smoke:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Compose configurations
        env:
          POSTGRES_PASSWORD: smokepassword
          APP_DOMAIN: localhost
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Build and boot local stack
        env:
          POSTGRES_PASSWORD: smokepassword
        run: docker compose up -d --build

      - name: Verify API health, seeded board, and SPA via Nginx proxy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health | grep -q '"db":"connected"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
          curl -sf http://localhost:3000/api/board | grep -q '"Backlog"'
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'

      - name: Verify 503 chaos header and live SSE streaming through Nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/tasks \
            -H "Content-Type: application/json" \
            -H "X-Simulate-Error: true" \
            -d '{"title":"Chaos check"}')
          test "$STATUS" = "503"

          node -e '
            (async () => {
              const controller = new AbortController();
              const sseRes = await fetch("http://localhost:3000/api/events", { signal: controller.signal });
              if (sseRes.status !== 200) throw new Error("SSE HTTP " + sseRes.status);
              const reader = sseRes.body.getReader();
              const first = await reader.read();
              const hello = new TextDecoder().decode(first.value);
              if (!hello.includes(": connected")) throw new Error("Missing SSE connected comment: " + hello);

              const createRes = await fetch("http://localhost:3000/api/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-Client-Id": "smoke-ci" },
                body: JSON.stringify({ title: "Docker Smoke Task", status: "Todo" })
              });
              if (createRes.status !== 201) throw new Error("Create HTTP " + createRes.status);
              const created = await createRes.json();

              const deadline = Date.now() + 5000;
              let payload = "";
              while (Date.now() < deadline) {
                const next = await Promise.race([
                  reader.read(),
                  new Promise((_, rej) => setTimeout(() => rej(new Error("SSE timeout")), 5000))
                ]);
                if (next.done) break;
                payload += new TextDecoder().decode(next.value);
                if (payload.includes("task:created") && payload.includes(created.id)) {
                  break;
                }
              }
              if (!payload.includes("task:created") || !payload.includes(created.id)) {
                throw new Error("Expected task:created in SSE stream, got: " + payload);
              }
              controller.abort();
              console.log("Docker SSE smoke test passed for task", created.id);
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2 (Amazon Linux)
    runs-on: ubuntu-latest
    needs: [server, client, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Skipping deploy: EC2_HOST or EC2_SSH_KEY secret is not configured."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "${EC2_USER}@${EC2_HOST}" "bash -s" << 'EOF'
          set -euo pipefail
          APP_DIR="/home/ec2-user/kanban"
          REPO_URL="https://github.com/vikramT75/collab-kanban.git"

          if ! command -v git >/dev/null 2>&1; then
            sudo dnf install -y git || sudo yum install -y git
          fi

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if [ ! -d ".git" ]; then
            git init -b main
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi

          git fetch origin main
          git checkout -f -B main origin/main

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi

          $COMPOSE_CMD -f docker-compose.prod.yml up -d --build
          docker image prune -f

          for i in $(seq 1 20); do
            if curl -sf http://localhost/api/health >/dev/null 2>&1 || curl -skf https://localhost/api/health >/dev/null 2>&1; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Production health check failed after deploy."
          $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=50
          exit 1
          EOF

          rm -f ~/.ssh/deploy_key
